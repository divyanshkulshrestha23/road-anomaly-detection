# Maps source sign classes to our sign classes. Works with any Indian sign dataset:
#   1. exact names in `groups` / `drop` are checked first (case- and punctuation-insensitive)
#   2. otherwise the first matching regex in `rules` decides (searched in the normalised name,
#      e.g. "speed_limit_40")
#   3. anything still unmatched is reported as UNMAPPED and dropped
#
# mode: grouped -> 5 classes from classes.yaml sign_classes (decision #14)
# mode: fine    -> keep each source class (needed if the app must show e.g. the speed value)
mode: grouped

# Primary dataset: Roboflow "Indian Traffic SignBoards" (major-project-166na), MIT licence, 75 classes.
groups: {}
drop: []

rules:
  # informatory signs: not in our classes
  - [drop, "^parking|petrol_pump|restriction_ends|same_destination"]
  - [speed_limit, "speed_limit|max_speed"]
  - [school, "school"]
  - [hospital, "hospital"]
  # mandatory / prohibitory (circular signs in IRC 67)
  - [regulatory, "prohibit|^no_|_no_|^stop$|stop_sign|give_way|compuls[ao]ry|keep_left|keep_right|no_entry|pass_either_side|height_limit|width_limit|length_limit|axle_load|load_limit|one_way|u_turn$|^u_turn|left_turn$|right_turn$|^left_turn|^right_turn|go_straight|straight_ahead"]
  # cautionary (triangular signs)
  - [warning, "curve|bend|cross|intersection|junction|side_road|roundabout|gap_in_median|men_at_work|work|pedestr|zebra|cattle|cycle_crossing|dip|falling_rock|hump|rough_road|speed_breaker|level_crossing|loose_gravel|narrow|slippery|steep|road_widens|chevron|quay|river_bank|traffic_signal|signal_ahead|go_slow|danger|merging|bridge|zigzag|y_intersection|t_intersection|staggered"]
